name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MONO_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          MONO_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MONO_KEYSTORE_PASSWORD: ${{ secrets.MONO_KEYSTORE_PASSWORD }}
          MONO_KEY_ALIAS: ${{ secrets.MONO_KEY_ALIAS }}
          MONO_KEY_PASSWORD: ${{ secrets.MONO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Lumen-$VERSION.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" "Lumen-$VERSION.apk" \
            --title "Lumen $VERSION" \
            --notes "${NOTES:-Build manuel}"
